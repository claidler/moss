<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moss</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#fafaf8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moss">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest?v=20260908-splash">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="note-menu" id="noteMenu" hidden>
  <button type="button" id="markAllRead">Mark all as read</button>
</div>
<div class="app">
  <aside class="sidebar">
    <div class="side-top">
      <div class="brand"><span class="mark">m</span> Moss</div>
      <button class="icon-btn new-chat" id="newChat" type="button" aria-label="New chat">+</button>
      <button class="icon-btn close-nav" id="closeNav" type="button" aria-label="Close menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="search">Search</div>
    <div class="bots" id="bots"></div>
  </aside>
  <main>
    <header class="chat-head">
      <button class="icon-btn menu" id="openNav" type="button" aria-label="Open menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="avatar" id="headAvatar"></div>
      <h1 id="chatTitle">Moss</h1>
      <span class="status" id="status" title="Connecting"><span class="dot"></span></span>
    </header>
    <div id="log"></div>
    <button id="toBottom" type="button" hidden>Latest ↓</button>
    <div class="composer-stack">
      <section class="ask" id="ask" hidden></section>
      <section class="goal-pill" id="goalPill" hidden></section>
      <div class="thumbs" id="thumbs" hidden></div>
      <form class="composer" id="form">
        <div class="slash-menu" id="slashMenu" hidden role="listbox" aria-label="Skills"></div>
        <div class="composer-main">
          <button class="attach" id="attachBtn" type="button" aria-label="Add photo or file">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.5"/><path d="M8 6l1.5-2h5L16 6"/></svg>
          </button>
          <input id="attachInput" type="file" multiple hidden>
          <textarea id="input" rows="1" enterkeyhint="enter" placeholder="Message Moss"></textarea>
          <button class="mic" id="micBtn" type="button" aria-label="Dictate" aria-pressed="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
          </button>
          <button class="stop" id="stop" type="button" aria-label="Stop" hidden>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
          </button>
          <button class="send" id="send" type="button" aria-label="Send">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="composer-controls" id="modelBar">
          <details class="chip-select" id="modelPick">
            <summary class="chip-select-trigger" id="modelTrigger" aria-label="Model">
              <span class="chip-select-label" id="modelLabel">Model</span>
              <span class="chip-select-chevron" aria-hidden="true">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              </span>
            </summary>
            <div class="chip-menu chip-menu-model" id="modelMenu" role="listbox" aria-label="Models"></div>
          </details>
          <details class="chip-select" id="thinkPick">
            <summary class="chip-select-trigger" id="thinkTrigger" aria-label="Thinking">
              <svg class="chip-effort-gauge" id="thinkGauge" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                <path d="M3.34 17a10 10 0 1 1 17.32 0"/>
                <path class="chip-effort-needle" d="M12 12V6"/>
                <circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>
              </svg>
              <span class="chip-select-label" id="thinkLabel">Thinking</span>
              <span class="chip-select-chevron" aria-hidden="true">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
              </span>
            </summary>
            <div class="chip-menu" id="thinkMenu" role="listbox" aria-label="Thinking level"></div>
          </details>
          <button class="goal-toggle" id="goalToggle" type="button" aria-pressed="false" title="Send this message as a goal">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>
            <span>Goal</span>
          </button>
        </div>
        <p class="dictation-status" id="dictationStatus" role="status" hidden></p>
      </form>
    </div>
  </main>
</div>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script>window.Prism = window.Prism || {}; Prism.manual = true;</script>
<script src="/vendor/prism.min.js"></script>
<script src="/vendor/prism-python.min.js"></script>
<script src="/vendor/prism-bash.min.js"></script>
<script src="/vendor/prism-json.min.js"></script>
<script src="/vendor/prism-yaml.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
