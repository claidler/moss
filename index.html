        const h0 = img.naturalHeight || img.height || 1200;
        const scale = Math.min(1, maxEdge / Math.max(w0, h0));
        const w = Math.max(1, Math.round(w0 * scale));
        const h = Math.max(1, Math.round(h0 * scale));
        try {
          const canvas = document.createElement("canvas");

          canvas.height = h;

  if (looksHtml) {
    el.innerHTML = "";
    const code = document.createElement("code");
    code.className = "language-html";
    code.textContent = src;
    const pre = document.createElement("pre");
    pre.appendChild(code);
    el.appendChild(pre);
    enhanceCodeBlocks(el, preview);
    return;
  }
  el.innerHTML = renderMd(src);
  wrapTables(el);
  enhanceCodeBlocks(el, preview);
}

function pretty(v) {
  if (v == null || v === "") return "";
  if (typeof v !== "string") {
    try { return JSON.stringify(v, null, 2); } catch { return String(v); }
  }
  try { return JSON.stringify(JSON.parse(v), null, 2); } catch { return v; }
}

function oneLine(v) {
  return pretty(v).replace(/\s+/g, " ").trim();
}

function thinkingList(parts) {
  if (!Array.isArray(parts)) {
    const s = String(parts || "").trim();
    return s ? [s] : [];
  }
  const out = [];
  const seen = new Set();
  parts.forEach((p) => {
    const s = String(p || "").trim();
    if (!s || seen.has(s)) return;
    seen.add(s);
    out.push(s);
  });
  return out;
}

function thinkingJoined(parts) {
  return thinkingList(parts).join("\n\n");
}

function stripClaidler(text) {
  return String(text || "").replace(/[ \t]*@claidler\b/gi, "").replace(/\n{3,}/g, "\n\n").trim();
}

function isProgressLead(text) {
  const t = String(text || "").trim();
  if (!t || t.length >= 240) return false;
  return /^(I['\u2019]ll|I will|Let me|I am going to|I'?m going to|Checking|Searching|Looking)\b/.test(t);
}

function splitNoteBody(text) {
  const cleaned = stripClaidler(text);
  if (!cleaned || /^NO_REPLY$/i.test(cleaned)) return { thinking: [], body: "" };
  const para = (cleaned.match(/^[\s\S]+?(?:\n\s*\n|$)/) || [cleaned])[0].trim();
  if (!isProgressLead(para)) return { thinking: [], body: cleaned };
  const rest = cleaned.slice(para.length).trim();
  if (!rest || /^NO_REPLY$/i.test(rest)) return { thinking: [para], body: "" };
  return { thinking: [para], body: rest };
}

function isProgressOnlyNote(n) {
  if (!n) return true;
  return !splitNoteBody(n.content || n.preview || "").body;
}

function visibleNotes() {
  return (notes || []).filter((n) => n && !isProgressOnlyNote(n));
}

function ensureSentenceSpacing(s) {
  return String(s || "").replace(/([.!?:])(?=[A-Z("])/g, "$1 ");
}

function stripThinkingPrefix(text, parts) {
  let out = String(text || "").replace(/<think>[\s\S]*?<\/think>/gi, "").replace(/<\|im_start\|>thinking[\s\S]*?<\|im_end\|>/gi, "");
  const original = out;
  const frags = thinkingList(parts).slice().sort((a, b) => b.length - a.length);
  let changed = true;
  let guard = 0;
  while (changed && guard++ < 24) {
    changed = false;
    const trimmed = out.replace(/^\s+/, "");
    for (let n = 0; n < frags.length; n++) {
      const f = frags[n];
      if (!f) continue;
      if (trimmed === f) { out = ""; changed = true; break; }
      if (trimmed.startsWith(f)) { out = trimmed.slice(f.length); changed = true; break; }
      const compact = f.replace(/\s+/g, " ").trim();
      if (!compact) continue;
      const src = trimmed;
      let i = 0;
      let j = 0;
      while (i < src.length && j < compact.length) {
        if (/\s/.test(src[i])) { i += 1; continue; }
        if (/\s/.test(compact[j])) { j += 1; continue; }
        if (src[i] !== compact[j]) break;
        i += 1;
        j += 1;
      }
      if (j >= compact.length) { out = src.slice(i); changed = true; break; }
    }
  }
  out = ensureSentenceSpacing(out.replace(/^\s+/, ""));
  if (!out && original.trim()) return ensureSentenceSpacing(original.trim());
  return out;
}

function paintThinking(el, parts, liveOpen) {
  if (!el) return;
  const list = thinkingList(parts);
  if (!list.length) {
    el.innerHTML = "";
    return;
  }
  const prev = el.querySelector("details.think-group");
  const wasOpen = prev ? Boolean(prev.open) : Boolean(liveOpen);
  el.innerHTML = "";
  const group = document.createElement("details");
  group.className = "think-group";
  if (wasOpen) group.open = true;
  const head = document.createElement("summary");
  const nm = document.createElement("span");
  nm.className = "tname";
  nm.textContent = list.length === 1 ? "Thinking" : "Thinking · " + list.length;
  head.appendChild(nm);
  const body = document.createElement("div");
  body.className = "think-body";
  body.textContent = thinkingJoined(list);
  group.appendChild(head);
  group.appendChild(body);
  el.appendChild(group);
}

function toolLabel(name) {
  const n = String(name || "tool");
  const labels = {
    sessions_search: "Search chats",
    sessions_list: "List chats",
    sessions_history: "Chat history",
    memory_search: "Search memory",
    memory_get: "Read memory",
    web_search: "Web search",
    web_fetch: "Open page",
    exec: "Run command",
    read: "Read file",
    write: "Write file",
    edit: "Edit file",
    apply_patch: "Patch file",
    ask_user: "Ask"
  };
  return labels[n] || n.replace(/_/g, " ");
}

function visibleTools(tools) {
  return (tools || []).filter((t) => t && t.name !== "ask_user");
}

function pendingQuestions(list) {
  return (list || []).filter((q) => q && q.status === "pending" && !(q.questions || []).some((item) => item && item.isSecret));
}

function toolState(t) {
  if (t && t.isError) return "failed";
  if (t && (t.phase === "result" || t.phase === "error" || t.result)) return "done";
  return "running";
}

function paintTools(rowEl, tools) {
  if (!rowEl) return;
  const list = visibleTools(tools);
  if (!list.length) {
    rowEl.innerHTML = "";
    return;
  }
  const prevGroup = rowEl.querySelector("details.tool-group");
  const wasOpen = Boolean(prevGroup && prevGroup.open);
  const prevToolOpen = [];
  if (prevGroup) {
    prevGroup.querySelectorAll("details.tool").forEach((d, i) => { prevToolOpen[i] = d.open; });
  }
  rowEl.innerHTML = "";
  const running = list.filter((t) => toolState(t) === "running").length;
  const failed = list.filter((t) => toolState(t) === "failed").length;
  const groupState = running ? "running" : (failed ? "failed" : "done");
  const group = document.createElement("details");
  group.className = "tool-group" + (failed ? " error" : "");
  if (wasOpen) group.open = true;
  const head = document.createElement("summary");
  const nm = document.createElement("span");
  nm.className = "tname";
  nm.textContent = running
    ? (list.length === 1 ? "Using " + toolLabel(list[0].name) : "Using " + list.length + " tools")
    : (list.length === 1 ? toolLabel(list[0].name) : list.length + " tools");
  const st = document.createElement("span");
  st.className = "tstate " + groupState;
  st.textContent = groupState;
  head.appendChild(nm);
  head.appendChild(st);
  const inner = document.createElement("div");
  inner.className = "tool-list";
  list.forEach((t, i) => {
    const state = toolState(t);
    const d = document.createElement("details");
    d.className = "tool" + (t.isError ? " error" : "");
    const s = document.createElement("summary");
    const tn = document.createElement("span");
    tn.className = "tname";
    tn.textContent = toolLabel(t.name);
    const ts = document.createElement("span");
    ts.className = "tstate " + state;
    ts.textContent = state;
    s.appendChild(tn);
    s.appendChild(ts);
    s.title = (t.name || "tool") + (t.args ? " · " + oneLine(t.args) : "");
    const body = document.createElement("div");
    body.className = "tbody";
    const pre = document.createElement("pre");
    const parts = [];
    const args = pretty(t.args);
    const result = pretty(t.result);
    if (args) parts.push(args);
    if (result) parts.push(result);
    pre.textContent = parts.join("\n\n") || "(no details)";
    body.appendChild(pre);
    d.appendChild(s);
    d.appendChild(body);
    if (prevToolOpen[i] === true) d.open = true;
    inner.appendChild(d);
  });
  group.appendChild(head);
  group.appendChild(inner);
  rowEl.appendChild(group);
}

function upsertTool(list, incoming) {
  if (!incoming) return list;
  const id = incoming.id || incoming.toolCallId || "";
  const idx = incoming.idx;
  let slot = id ? list.find((x) => x.id === id) : null;
  if (!slot && idx != null) slot = list.find((x) => x.idx === idx);
  if (!slot) {
    slot = { id: id || "t" + list.length, name: "", args: "", result: "", phase: "start", isError: false, idx };
    list.push(slot);
  }
  if (incoming.name && !slot.name) slot.name = incoming.name;
  if (incoming.phase) slot.phase = incoming.phase;
  if (incoming.isError) slot.isError = true;
  if (typeof incoming.args === "string" && incoming.args) {
    if (incoming.appendArgs) slot.args = (slot.args || "") + incoming.args;
    else if (incoming.phase === "result" || incoming.replaceArgs || !slot.args || incoming.args.length >= slot.args.length) slot.args = incoming.args;
  }
  if (incoming.result) slot.result = incoming.result;
  return list;
}

function upsertQuestion(list, incoming) {
  if (!incoming || !incoming.id) return list;
  const row = {
    id: incoming.id,
    status: incoming.status || "pending",
    createdAtMs: incoming.createdAtMs || Date.now(),
    expiresAtMs: incoming.expiresAtMs || 0,
    questions: incoming.questions || [],
    answers: incoming.answers
  };
  const idx = list.findIndex((x) => x.id === row.id);
  if (idx >= 0) list[idx] = Object.assign({}, list[idx], row);
  else list.push(row);
  return list;
}

function paintQsums(rowEl, questions) {
  if (!rowEl) return;
  const list = (questions || []).filter((q) => q && q.status && q.status !== "pending");
  rowEl.innerHTML = "";
  if (!list.length) return;
  list.forEach((q) => {
    const card = document.createElement("div");
    card.className = "qsum";
    const title = document.createElement("div");
    title.style.marginBottom = "4px";
    const b = document.createElement("b");
    b.textContent = q.status === "answered" ? "Answered" : (q.status === "expired" ? "Timed out" : "Skipped");
    title.appendChild(b);
    card.appendChild(title);
    (q.questions || []).forEach((item) => {
      const line = document.createElement("div");
      line.className = "qline";
      const lab = document.createElement("b");
      lab.textContent = (item.header || item.question || "Question") + "";
      const val = document.createElement("span");
      const picked = q.answers && q.answers.answers && q.answers.answers[item.questionId];
      val.textContent = q.status === "answered"
        ? (Array.isArray(picked) && picked.length ? picked.join(", ") : "—")
        : (q.status === "expired" ? "no answer" : "skipped");
      line.appendChild(lab);
      line.appendChild(val);
      card.appendChild(line);
    });
    rowEl.appendChild(card);
  });
}

function resetAskUi(id) {
  if (askUi.id === id) return;
  askUi = { id: id || "", step: 0, picked: {}, other: "", submitting: false, error: "" };
}

function renderAsk(chat) {
  const pending = pendingQuestions(chat && chat.questions);
  if (!pending.length) {
    askEl.hidden = true;
    askEl.innerHTML = "";
    resetAskUi("");
    return;
  }
  const q = pending[0];
  resetAskUi(q.id);
  const items = q.questions || [];
  if (askUi.step >= items.length) askUi.step = Math.max(0, items.length - 1);
  const item = items[askUi.step] || items[0];
  const multi = !!(item && item.multiSelect);
  const selected = askUi.picked[item.questionId] || [];
  const last = askUi.step >= items.length - 1;
  askEl.hidden = false;
  askEl.innerHTML = "";
  const top = document.createElement("div");
  top.className = "ask-top";
  const kicker = document.createElement("div");
  kicker.className = "ask-kicker";
  kicker.textContent = "Question";
  top.appendChild(kicker);
  if (items.length > 1) {
    const step = document.createElement("div");
    step.className = "ask-step";
    step.textContent = (askUi.step + 1) + " / " + items.length;
    top.appendChild(step);
  }
  askEl.appendChild(top);
  if (item.header) {
    const h = document.createElement("div");
    h.className = "ask-header";
    h.textContent = item.header;
    askEl.appendChild(h);
  }
  const prompt = document.createElement("div");
  prompt.className = "ask-prompt";
  prompt.textContent = item.question || "Choose one";
  askEl.appendChild(prompt);
  const opts = document.createElement("div");
  opts.className = "ask-opts";
  const options = item.options || [];
  options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "ask-opt" + (multi ? " multi" : "") + (selected.includes(opt.label) ? " selected" : "");
    btn.disabled = askUi.submitting;
    const mark = document.createElement("span");
    mark.className = "ask-mark";
    mark.textContent = selected.includes(opt.label) ? "✓" : "";
    const copy = document.createElement("span");
    copy.className = "ask-copy";
    const strong = document.createElement("strong");
    strong.textContent = opt.label;
    copy.appendChild(strong);
    if (opt.description) {
      const small = document.createElement("small");
      small.textContent = opt.description;
      copy.appendChild(small);
    }
    const kbd = document.createElement("span");
    kbd.className = "ask-kbd";
    kbd.textContent = String(i + 1);
    btn.appendChild(mark);
    btn.appendChild(copy);
    btn.appendChild(kbd);
    btn.addEventListener("click", () => chooseAskOption(chat, q, item, opt.label, false));
    opts.appendChild(btn);
  });
  const otherBtn = document.createElement("button");
  otherBtn.type = "button";
  otherBtn.className = "ask-opt other" + (askUi.other.trim() && selected.includes(askUi.other.trim()) ? " selected" : "");
  otherBtn.disabled = askUi.submitting;
  const otherMark = document.createElement("span");
  otherMark.className = "ask-mark";
  const otherCopy = document.createElement("span");
  otherCopy.className = "ask-copy";
  const otherInput = document.createElement("input");
  otherInput.className = "ask-other";
  otherInput.type = "text";
  otherInput.maxLength = 500;
  otherInput.placeholder = "Other…";
  otherInput.value = askUi.other;
  otherInput.disabled = askUi.submitting;
  otherInput.addEventListener("input", () => {
    askUi.other = otherInput.value;
  });
  otherInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      const text = otherInput.value.trim();
      if (text) chooseAskOption(chat, q, item, text, true);
    }
  });
  otherCopy.appendChild(otherInput);
  otherBtn.appendChild(otherMark);
  otherBtn.appendChild(otherCopy);
  otherBtn.addEventListener("click", () => otherInput.focus());
  opts.appendChild(otherBtn);
  askEl.appendChild(opts);
  const foot = document.createElement("div");
  foot.className = "ask-foot";
  if (askUi.error) {
    const err = document.createElement("div");
    err.className = "ask-err";
    err.textContent = askUi.error;
    foot.appendChild(err);
  }
  if (askUi.step > 0) {
    const back = document.createElement("button");
    back.type = "button";
    back.className = "ask-back";
    back.textContent = "Back";
    back.disabled = askUi.submitting;
    back.addEventListener("click", () => {
      askUi.step -= 1;
      renderAsk(chat);
    });
    foot.appendChild(back);
  }
  const skip = document.createElement("button");
  skip.type = "button";
  skip.className = "ask-skip";
  skip.textContent = "Skip";
  skip.disabled = askUi.submitting;
  skip.addEventListener("click", () => sendAsk(chat, q, true));
  foot.appendChild(skip);
  const needSend = multi || !options.length || !last || askUi.other.trim();
  if (needSend || items.length > 1) {
    const send = document.createElement("button");
    send.type = "button";
    send.className = "ask-send";
    send.textContent = last ? (askUi.submitting ? "Sending…" : "Send") : "Continue";
    send.disabled = askUi.submitting;
    send.addEventListener("click", () => {
      const text = askUi.other.trim();
      if (text) {
        chooseAskOption(chat, q, item, text, true);
        return;
      }
      if (!last) {
        if (!(askUi.picked[item.questionId] || []).length) {
          askUi.error = "Pick an option";
          renderAsk(chat);
          return;
        }
        askUi.step += 1;
        askUi.error = "";
        renderAsk(chat);
        return;
      }
      sendAsk(chat, q, false);
    });
    foot.appendChild(send);
  }
  askEl.appendChild(foot);
}

function chooseAskOption(chat, q, item, label, isOther) {
  if (!item || askUi.submitting) return;
  const key = item.questionId;
  if (item.multiSelect) {
    const cur = askUi.picked[key] ? askUi.picked[key].slice() : [];
    const i = cur.indexOf(label);
    if (i >= 0) cur.splice(i, 1);
    else cur.push(label);
    askUi.picked[key] = cur;
    if (isOther) askUi.other = label;
    askUi.error = "";
    renderAsk(chat);
    return;
  }
  askUi.picked[key] = [label];
  if (isOther) askUi.other = label;
  askUi.error = "";
  const last = askUi.step >= (q.questions || []).length - 1;
  if (!last) {
    askUi.step += 1;
    renderAsk(chat);
    return;
  }
  sendAsk(chat, q, false);
}

async function sendAsk(chat, q, cancel) {
  if (!chat || !q || askUi.submitting) return;
  const answers = {};
  if (!cancel) {
    for (const item of q.questions || []) {
      const vals = (askUi.picked[item.questionId] || []).map((s) => String(s).trim()).filter(Boolean);
      if (!vals.length) {
        askUi.error = "Pick an option";
        renderAsk(chat);
        return;
      }
      answers[item.questionId] = item.multiSelect ? vals : [vals[vals.length - 1]];
    }
  }
  askUi.submitting = true;
  askUi.error = "";
  renderAsk(chat);
  try {
    const res = await fetch("/api/chats/" + chat.id + "/answer", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(cancel ? { id: q.id, cancel: true } : { id: q.id, answers })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    const next = data.questions || [];
    if (next.length) chat.questions = next;
    else upsertQuestion(chat.questions || (chat.questions = []), Object.assign({}, q, {
      status: cancel ? "cancelled" : "answered",
      answers: cancel ? undefined : { answers }
    }));
    const last = (chat.messages || [])[(chat.messages || []).length - 1];
    if (last && last.role === "assistant") {
      last.questions = slimClientQuestions(chat.questions);
    } else {
      chat.liveQuestions = slimClientQuestions(chat.questions);
    }
    await saveChat(chat);
    if (activeId === chat.id) {
      paintChat(chat);
    }
  } catch (e) {
    askUi.submitting = false;
    askUi.error = (e && e.message) || "Could not send";
    if (activeId === chat.id) renderAsk(chat);
  }
}

function slimClientQuestions(questions) {
  return (questions || []).filter((q) => q && q.id).map((q) => ({
    id: q.id,
    status: q.status || "pending",
    createdAtMs: q.createdAtMs,
    expiresAtMs: q.expiresAtMs,
    questions: q.questions || [],
    answers: q.answers
  }));
}

function add(role, text, tools, questions, opts) {
  if (emptyEl && emptyEl.parentNode) emptyEl.remove();
  emptyEl = null;
  if (!stamped) {
    const s = document.createElement("div");
    s.className = "stamp";
    s.textContent = new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    log.appendChild(s);
    stamped = true;
  }
  const row = document.createElement("div");
  row.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  const toolsEl = document.createElement("div");
  toolsEl.className = "tools";
  const thinkEl = document.createElement("div");
  thinkEl.className = "think";
  const qEl = document.createElement("div");
  qEl.className = "qsums";
  const md = document.createElement("div");
  md.className = "md";
  bubble.appendChild(toolsEl);
  bubble.appendChild(thinkEl);
  bubble.appendChild(qEl);
  const imgs = opts && opts.images;
  if (imgs && imgs.length) {
    const imgsEl = document.createElement("div");
    imgsEl.className = "imgs";
    imgs.forEach((src) => {
      if (!src) return;
      const im = document.createElement("img");
      im.alt = "";
      im.loading = "lazy";
      im.src = src;
      imgsEl.appendChild(im);
    });
    bubble.appendChild(imgsEl);
  }
  bubble.appendChild(md);
  const thinking = opts && opts.thinking;
  setBubble(md, stripClaidler(stripThinkingPrefix(text, thinking)), opts);
  if (tools && tools.length) paintTools(toolsEl, tools);
  if (thinking && thinkingList(thinking).length) paintThinking(thinkEl, thinking, Boolean(opts && opts.liveThinking));
  if (questions && questions.length) paintQsums(qEl, questions);
  row.appendChild(bubble);
  log.appendChild(row);
  stickToBottom(true);
  return bubble;
}

function timeLabel(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
  return d.toLocaleDateString([], { month: "short", day: "numeric" });
}

function chatStarted(c) {
  if (!c) return false;
  if (c.pending || c.partial || pendingQuestions(c.questions).length) return true;
  if ((c.messages || []).some((m) => m && m.role === "user" && m.content)) return true;
  if (c.title && c.title !== "New chat") return true;
  if (c.preview && c.preview !== "New chat") return true;
  return false;
}

function runningPreview(c) {
  const pending = pendingQuestions(c.questions)[0];
  if (pending && pending.questions && pending.questions[0] && pending.questions[0].question) {
    return pending.questions[0].question;
  }
  if (c.partial) return c.partial;
  const live = c.liveTools && c.liveTools[0] && c.liveTools[0].name;
  if (live) return "Using " + toolLabel(live);
  if (c.preview && c.preview !== "New chat") return c.preview;
  return "Working\u2026";
}

}

function renderBoardRow() {

  row.querySelector(".bot-preview").textContent = latest
    ? (latest.title + (latest.preview ? " · " + latest.preview : ""))
    : "Newsletter board";
  const time = row.querySelector(".bot-time");
  if (time && latest) time.textContent = timeLabel(latest.createdAt);
  row.addEventListener("click", (e) => {
    if (suppressBoardClick) {
      e.preventDefault();
      e.stopPropagation();
      return;
    }
    openBoard();
  });
  bindLongPress(row, () => showNoteMenuFor(row));
  return row;
}

let suppressBoardClick = false;
let noteMenuTimer = null;

function hideNoteMenu() {
  const menu = document.getElementById("noteMenu");
  if (menu) menu.hidden = true;
}

function showNoteMenuFor(el) {
  const menu = document.getElementById("noteMenu");
  const btn = document.getElementById("markAllRead");
  if (!menu || !btn) return;
  btn.disabled = notesUnread <= 0;
  btn.textContent = notesUnread > 0 ? "Mark all as read" : "All read";
  menu.hidden = false;
  const pad = 8;
  const r = el.getBoundingClientRect();
  let left = r.left;
  let top = r.bottom + 6;
  const w = menu.offsetWidth || 196;
  const h = menu.offsetHeight || 48;
  if (left + w > window.innerWidth - pad) left = window.innerWidth - w - pad;
  if (top + h > window.innerHeight - pad) top = Math.max(pad, r.top - h - 6);
  if (left < pad) left = pad;
  menu.style.left = left + "px";
  menu.style.top = top + "px";
}

function bindLongPress(el, onLong, gate) {
  let startX = 0;
  let startY = 0;
  const ok = () => !gate || gate();
  const clear = () => {
    if (noteMenuTimer) {
      clearTimeout(noteMenuTimer);
      noteMenuTimer = null;
    }
  };
  el.addEventListener("pointerdown", (e) => {
    if (!ok()) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    startX = e.clientX;
    startY = e.clientY;
    suppressBoardClick = false;
    clear();
    noteMenuTimer = setTimeout(() => {
      noteMenuTimer = null;
      suppressBoardClick = true;
      try { if (navigator.vibrate) navigator.vibrate(12); } catch (err) {}
      onLong(e);
      setTimeout(() => { suppressBoardClick = false; }, 400);
    }, 520);
  });
  el.addEventListener("pointermove", (e) => {
    if (!noteMenuTimer) return;
    if (Math.abs(e.clientX - startX) > 12 || Math.abs(e.clientY - startY) > 12) clear();
  });
  el.addEventListener("pointerup", clear);
  el.addEventListener("pointercancel", clear);
  el.addEventListener("contextmenu", (e) => {
    if (!ok()) return;
    e.preventDefault();
    clear();
    suppressBoardClick = true;
    onLong(e);
    setTimeout(() => { suppressBoardClick = false; }, 400);
  });
}

async function markAllRead() {
  hideNoteMenu();
  if (!notesUnread) return;
  notes.forEach((n) => { n.read = true; });
  notesUnread = 0;
  renderList();
  if (view === "board") paintBoard();
  try {
    await fetch("/api/notifications/read-all", { method: "POST" });
  } catch (e) {}
  await refreshNotes();
  if (view === "board") paintBoard();
}

function paintBoard() {
  setView("board");
  noteOpen = null;
  log.innerHTML = "";
  stamped = false;
  emptyEl = null;
  chatTitle.textContent = "Automations";
  headAvatar.className = "avatar board-face";
  headAvatar.innerHTML = boardGlyph();
  headAvatar.classList.remove("working");
  askEl.hidden = true;
  askEl.innerHTML = "";
  syncBusy();
  const shown = visibleNotes();
  if (!shown.length) {
    log.innerHTML = '<div id="empty"><h2>Automations</h2><p>When scheduled jobs finish, they land here like a newsletter. Tap one to read it in full.</p></div>';
    emptyEl = document.getElementById("empty");
    return;
  }
  const wrap = document.createElement("div");
  wrap.className = "notes";
  shown.forEach((n) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "note-card" + (n.read ? "" : " unread") + (n.status === "error" ? " error" : "");
    btn.innerHTML = `<div class="note-kicker"></div><div class="note-title"></div><div class="note-preview"></div><div class="note-meta"></div>`;
    btn.querySelector(".note-kicker").textContent = (n.status === "error" ? "Failed · " : "") + "Automation";
    btn.querySelector(".note-title").textContent = n.title || "Automation";
    btn.querySelector(".note-preview").textContent = splitNoteBody(n.preview || n.content || "").body || n.preview || "";
    btn.querySelector(".note-meta").textContent = timeLabel(n.createdAt);
    btn.addEventListener("click", () => openNote(n.id));
    wrap.appendChild(btn);
  });
  log.appendChild(wrap);
}

async function openNote(id) {
  setView("article");
  noteOpen = id;
  setNav(false);
  log.innerHTML = "";
  stamped = true;
  emptyEl = null;
  const back = document.createElement("button");
  back.type = "button";
  back.className = "note-back";
  back.textContent = "All automations";
  back.addEventListener("click", () => openBoard());
  log.appendChild(back);
  chatTitle.textContent = "Automation";
  headAvatar.className = "avatar board-face";
  headAvatar.innerHTML = boardGlyph();
  try {
    const res = await fetch("/api/notifications/" + encodeURIComponent(id), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const item = await res.json();
    chatTitle.textContent = item.title || "Automation";
    const kicker = document.createElement("div");
    kicker.className = "stamp";
    kicker.textContent = (item.status === "error" ? "Failed · " : "Automation · ") + timeLabel(item.createdAt);
    log.appendChild(kicker);
    const split = splitNoteBody(item.content || item.preview || "");
    if (!split.body) {
      const empty = document.createElement("div");
      empty.id = "empty";
      empty.innerHTML = "<h2>No update</h2><p>This run had nothing to report.</p>";
      log.appendChild(empty);
    } else {
      add("bot", split.body, null, null, split.thinking.length ? { thinking: split.thinking } : undefined);
    }
    const n = notes.find((x) => x.id === id);
    if (n) n.read = true;
    notesUnread = notes.filter((x) => !x.read).length;
    fetch("/api/notifications/" + encodeURIComponent(id) + "/read", { method: "POST" }).catch(() => {});
    renderList();
    maybeRequestNotifyPerm();
  } catch (e) {
    const empty = document.createElement("div");
    empty.id = "empty";
    empty.innerHTML = "<h2>Missing</h2><p>That automation could not be opened.</p>";
    log.appendChild(empty);
  }
}

async function openBoard() {
  setView("board");
  noteOpen = null;
  setNav(false);
  await refreshNotes();
  paintBoard();
  renderList();
}

function maybeDesktopNote(item) {
  if (!item || isProgressOnlyNote(item)) return;
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  if (view !== "chat") return;
  try {
    const n = new Notification(item.title || "Automation", { body: item.preview || "", tag: item.id });
    n.onclick = () => { window.focus(); openNote(item.id); };
  } catch (e) {}
}

function maybeRequestNotifyPerm() {
  if (!("Notification" in window) || Notification.permission !== "default") return;
  Notification.requestPermission().catch(() => {});
}

async function refreshNotes() {
  try {
    const res = await fetch("/api/notifications", { cache: "no-store" });
    if (!res.ok) return;
    const data = await res.json();
    const items = (data.items || []).filter((n) => n && !isProgressOnlyNote(n));
    if (notesReady) {
      items.forEach((n) => {
        if (!n.read && n.id && !notesSeen.has(n.id)) maybeDesktopNote(n);
      });
    }
    notes = items;
    notes.forEach((n) => { if (n && n.id) notesSeen.add(n.id); });
    notesUnread = notes.filter((n) => !n.read).length;
    notesReady = true;
    renderList();
  } catch (e) {}
}

function ensureNotesPoll() {
  if (notesTimer) return;
  notesTimer = setInterval(() => {
    if (document.visibilityState === "hidden") return;
    refreshNotes().then(() => {
      if (view === "board") paintBoard();
    });
  }, 8000);
}

function renderList() {
  botsEl.innerHTML = "";
  botsEl.appendChild(renderBoardRow());
  const ordered = chats.slice().sort((a, b) => {
    const ap = a.pending ? 1 : 0;
    const bp = b.pending ? 1 : 0;
    if (ap !== bp) return bp - ap;
    return (b.updatedAt || 0) - (a.updatedAt || 0);
  });
  ordered.forEach((c) => {
    const row = document.createElement("div");
    row.className = "bot-row" + (view === "chat" && c.id === activeId ? " active" : "") + (c.pending ? " running" : "");
    if (c.pending) row.setAttribute("aria-busy", "true");
    row.innerHTML =
      `<div class="avatar${c.pending ? " working" : ""}">${blobSvg(colorFor(c.id), "b" + c.id)}</div>
       <div><div class="bot-name"></div><div class="bot-preview"></div></div>
       ` +
      (c.pending ? `<span class="bot-run${c.asking || pendingQuestions(c.questions).length ? " ask" : ""}">${c.asking || pendingQuestions(c.questions).length ? "Asking" : "Running"}</span>` : `<div class="bot-time"></div>`) +
      (chatStarted(c)
        ? `<button class="del" type="button" aria-label="Delete chat">
             <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M10 11v6M14 11v6M6 7l1 12h10l1-12"/></svg>
           </button>`
        : `<span></span>`);
    row.querySelector(".bot-name").textContent = c.title || "New chat";
    row.querySelector(".bot-preview").textContent = c.pending ? runningPreview(c) : (c.preview || "New chat");
    const time = row.querySelector(".bot-time");
    if (time) time.textContent = timeLabel(c.updatedAt);
    row.addEventListener("click", () => switchChat(c.id));
    const del = row.querySelector(".del");
    if (del) {
      del.addEventListener("click", (e) => {
        e.stopPropagation();
        deleteChat(c.id);
      });
    }
    botsEl.appendChild(row);
  });
}

function chatById(id) {
  return chats.find((c) => c.id === id);
}

function syncBusy() {
  if (view !== "chat") {
    sendBtn.disabled = true;
    input.placeholder = "Automations board";
    headAvatar.classList.remove("working");
    return;
  }
  const chat = chatById(activeId);
  const busy = !!(chat && chat.pending);
  sendBtn.disabled = false;
  input.placeholder = busy ? "Add a follow-up" : "Message Moss";
  headAvatar.classList.toggle("working", busy);
}

function paintChat(chat) {
  setView("chat");
  noteOpen = null;
  log.innerHTML = "";
  stamped = false;
  emptyEl = null;
  chatTitle.textContent = chat.title || "Moss";
  headAvatar.className = "avatar";
  headAvatar.innerHTML = blobSvg(colorFor(chat.id), "head");
  const msgs = chat.messages || [];
  if (!msgs.length && !chat.partial && !pendingQuestions(chat.questions).length) {
    showEmpty();
    renderAsk(chat);
    syncBusy();
    return;
  }
  msgs.forEach((m) => {
    if (!m || (!m.content && !(m.tools && m.tools.length) && !(m.questions && m.questions.length) && !thinkingList(m.thinking).length)) return;
    add(m.role === "user" ? "user" : "bot", m.content || "", m.tools, m.questions, { thinking: m.thinking, images: m.images });
  });
  const last = msgs[msgs.length - 1];
  if (chat.pending && !(last && last.role === "assistant")) {
    add("bot", chat.partial || "", chat.liveTools, chat.questions, { preview: false, thinking: chat.thinking, liveThinking: true });
  } else if (last && last.role === "assistant" && chat.questions && chat.questions.length) {
    const bubble = log.querySelector(".msg.bot:last-of-type .bubble");
    const qEl = bubble && bubble.querySelector(".qsums");
    if (qEl) paintQsums(qEl, chat.questions);
  }
  renderAsk(chat);
  syncBusy();
}

function rememberChat(chat) {
  const existing = chatById(chat.id);
  const row = existing || {
    id: chat.id,
    title: chat.title || "New chat",
    preview: chat.preview || "New chat",
    updatedAt: chat.updatedAt || Date.now(),
    messages: [],
    pending: false,
    asking: false,
    partial: "",
    liveTools: [],
    questions: [],
    saveChain: Promise.resolve()
  };
  if (!existing) chats.unshift(row);
  row.title = chat.title || row.title;
  row.updatedAt = chat.updatedAt || row.updatedAt;
  if (Array.isArray(chat.messages)) row.messages = chat.messages;
  row.pending = !!chat.pending;
  row.asking = !!chat.asking;
  row.partial = chat.partial || "";
  row.liveTools = chat.liveTools || [];
  row.thinking = Array.isArray(chat.thinking) ? chat.thinking : thinkingList(chat.thinking);
  if (Array.isArray(chat.questions)) row.questions = chat.questions;
  const last = row.messages && row.messages[row.messages.length - 1];
  row.preview = chat.preview || row.partial || (last && last.content) || row.preview || "New chat";
  return row;
}

function liveStream(chat) {
  return !!(chat && chat.pending && chat.abort && !chat.abort.signal.aborted);
}

async function fetchChat(id) {
  const res = await fetch("/api/chats/" + id, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

let pollTimer = null;
let pollInFlight = false;

function ensurePoll() {
  if (pollTimer) return;
  pollTimer = setInterval(() => { tickPending(); }, 1000);
}

function stopPollIfIdle() {
  if (chats.some((c) => c.pending)) return;
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

async function tickPending() {
  if (pollInFlight) return;
  const pending = chats.filter((c) => c.pending && !liveStream(c));
  if (!pending.length) {
    stopPollIfIdle();
    return;
  }
  pollInFlight = true;
  try {
    for (const chat of pending) {
      if (chat.gone) continue;
      try {
        const full = await fetchChat(chat.id);
        rememberChat(full);
        if (chat.id === activeId) paintChat(chatById(chat.id) || chat);
      } catch (e) {}
    }
    renderList();
    syncBusy();
  } finally {
    pollInFlight = false;
    stopPollIfIdle();
  }
}

async function refreshVisible() {
  if (document.visibilityState === "hidden") return;
  await refreshNotes();
  if (view !== "chat") {
    if (view === "board") paintBoard();
    if (chats.some((c) => c.pending)) ensurePoll();
    await tickPending();
    return;
  }
  if (activeId) {
    const chat = chatById(activeId);
    if (!liveStream(chat)) {
      try {
        const full = await fetchChat(activeId);
        const next = rememberChat(full);
        paintChat(next);
      } catch (e) {}
    }
  }
  if (chats.some((c) => c.pending)) ensurePoll();
  await tickPending();
}

function saveChat(chat) {
  const msgs = (chat.messages || []).map((m) => {
    const row = { role: m.role, content: m.content };
    if (m.tools && m.tools.length) row.tools = m.tools;
    if (m.questions && m.questions.length) row.questions = m.questions;
    if (Array.isArray(m.images) && m.images.length) row.images = m.images;
    if (Array.isArray(m.imageNames) && m.imageNames.length) row.imageNames = m.imageNames;
    const think = thinkingList(m.thinking);
    if (think.length) row.thinking = think;
    return row;
  });
  const first = msgs.find((m) => m.role === "user");
  const title = first ? first.content.trim().replace(/\s+/g, " ").slice(0, 42) : "New chat";
  const last = msgs[msgs.length - 1];
  const liveName = chat.liveTools && chat.liveTools[0] && chat.liveTools[0].name;
  const lastTools = last && last.tools;
  const toolHint = liveName ? "Using " + liveName : (lastTools && lastTools.length ? "Used " + lastTools.map((t) => t.name).filter(Boolean).join(", ") : "");
  chat.title = title;
  chat.preview = chat.partial || (last && last.content) || toolHint || "New chat";
  chat.updatedAt = Date.now();
  chats = [chat].concat(chats.filter((x) => x.id !== chat.id));
  if (activeId === chat.id) chatTitle.textContent = title;
  renderList();
  chat.saveChain = (chat.saveChain || Promise.resolve()).then(async () => {
    if (chat.gone) return;
    await fetch("/api/chats/" + chat.id, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: msgs, title })
    });
  }).catch(() => {});
  return chat.saveChain;
}

async function boot() {
  const res = await fetch("/api/chats", { cache: "no-store" });
  const data = await res.json();
  chats = (data.chats || []).map((c) => ({
    ...c,
    messages: c.messages || [],
    pending: !!c.pending,
    asking: !!c.asking,
    partial: c.partial || "",
    liveTools: c.liveTools || [],
    questions: c.questions || [],
    saveChain: Promise.resolve()
  }));
  activeId = data.activeId;
  if (!activeId && chats[0]) activeId = chats[0].id;
  if (!activeId) {
    await createChat();
    await refreshNotes();
    ensureNotesPoll();
    return;
  }
  const full = await fetchChat(activeId);
  const chat = rememberChat(full);
  paintChat(chat);
  await refreshNotes();
  ensureNotesPoll();
  renderList();
  if (chats.some((c) => c.pending)) ensurePoll();
}

async function createChat() {
  const existing = chats.find((c) => !chatStarted(c));
  if (existing) {
    await switchChat(existing.id);
    return;
  }
  const created = await (await fetch("/api/chats", { method: "POST" })).json();
  const chat = rememberChat({ ...created, messages: created.messages || [], preview: "New chat" });
  activeId = chat.id;
  paintChat(chat);
  renderList();
  setNav(false);
  clearComposer();
  input.focus();
}

async function deleteChat(id) {
  const doomed = chatById(id);
  if (!chatStarted(doomed)) return;
  if (doomed) {
    doomed.gone = true;
    if (doomed.abort) doomed.abort.abort();
  }
  const res = await fetch("/api/chats/" + id, { method: "DELETE" });
  if (!res.ok) return;
  const data = await res.json();
  const wasActive = id === activeId;
  const kept = new Map(chats.filter((c) => c.id !== id).map((c) => [c.id, c]));
  chats = (data.chats || []).map((c) => kept.get(c.id) || { ...c, messages: c.messages || [], pending: !!c.pending, asking: !!c.asking, partial: c.partial || "", liveTools: c.liveTools || [], questions: c.questions || [], saveChain: Promise.resolve() });
  activeId = data.activeId;
  if (wasActive) {
    const full = await (await fetch("/api/chats/" + activeId, { cache: "no-store" })).json();
    paintChat(rememberChat(full));
  }
  renderList();
}

async function switchChat(id) {
  if (id === activeId) {
    setNav(false);
    return;
  }
  let chat = chatById(id);
  if (!liveStream(chat)) {
    const full = await fetchChat(id);
    chat = rememberChat(full);
  }
  await fetch("/api/chats/" + id + "/select", { method: "POST" });
  activeId = id;
  paintChat(chat);
  renderList();
  setNav(false);
  if (chats.some((c) => c.pending)) ensurePoll();
  input.focus();
}

function streamChat(body, signal, onJson) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/v1/chat/completions");
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.setRequestHeader("Accept", "text/event-stream");
    try { xhr.overrideMimeType("text/plain; charset=utf-8"); } catch (e) {}
    xhr.timeout = 0;
    let seen = 0;
    let buf = "";
    const pump = () => {
      const all = xhr.responseText || "";
      if (all.length <= seen) return;
      buf += all.slice(seen);
      seen = all.length;
      let n;
      while ((n = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, n).trim();
        buf = buf.slice(n + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") continue;
        try { onJson(JSON.parse(data)); } catch (e) {}
      }
    };
    xhr.onprogress = pump;
    xhr.onload = () => {
      pump();
      if (xhr.status >= 200 && xhr.status < 300) resolve();
      else if (xhr.status === 409) {
        const err = new Error("pending");
        err.code = "pending";
        reject(err);
      } else reject(new Error("HTTP " + xhr.status + " " + String(xhr.responseText || "").slice(0, 240)));
    };
    xhr.onerror = () => reject(new TypeError("Failed to fetch"));
    xhr.onabort = () => {
      const err = new Error("Aborted");
      err.name = "AbortError";
      reject(err);
    };
    if (signal) {
      if (signal.aborted) {
        const err = new Error("Aborted");
        err.name = "AbortError";
        reject(err);
        return;
      }
      signal.addEventListener("abort", () => xhr.abort(), { once: true });
    }
    xhr.send(JSON.stringify(body));
  });
}

async function sendFollowup(chat, text, images) {
  const items = normalizeImages(images);
  const atts = items.map((item) => {
    const url = item.url;
    const comma = url.indexOf(",");
    return {
      type: "image",
      mimeType: item.mime || "image/jpeg",
      fileName: item.fileName || undefined,
      content: comma >= 0 ? url.slice(comma + 1) : url
    };
  });
  const urls = items.map((i) => i.url);
  const names = items.map((i) => i.fileName).filter(Boolean);
  if (activeId === chat.id) add("user", text, undefined, undefined, { images: urls.length ? urls : undefined });
  try {
    const res = await fetch("/api/chats/" + chat.id + "/followup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, attachments: atts.length ? atts : undefined })
    });
    if (res.ok) {
      const last = (chat.messages || [])[(chat.messages || []).length - 1];
      if (!(last && last.role === "user" && last.content === text)) {
        chat.messages = (chat.messages || []).concat([{ role: "user", content: text, images: urls.length ? urls : undefined, imageNames: names.length ? names : undefined }]);
      }
      await saveChat(chat);
      return;
    }
    if (res.status === 409) {
      const next = rememberChat(await fetchChat(chat.id));
      const last = (next.messages || [])[(next.messages || []).length - 1];
      if (!(last && last.role === "user" && last.content === text)) {
        next.messages = (next.messages || []).concat([{ role: "user", content: text, images: urls.length ? urls : undefined, imageNames: names.length ? names : undefined }]);
      }
      if (!next.pending) await startTurn(next);
      else if (activeId === next.id) paintChat(next);
      return;
    }
    throw new Error("HTTP " + res.status);
  } catch (e) {
    const last = (chat.messages || [])[(chat.messages || []).length - 1];
    if (!(last && last.role === "user" && last.content === text)) {
      chat.messages = (chat.messages || []).concat([{ role: "user", content: text, images: urls.length ? urls : undefined, imageNames: names.length ? names : undefined }]);
      await saveChat(chat);
    }
    if (activeId === chat.id) setStatus("bad");
  } finally {
    if (activeId === chat.id) {
      syncBusy();
      input.focus();
    }
  }
}

async function send(text, images) {
  if (view !== "chat") return;
  const chat = chatById(activeId);
  if (!chat) return;
  if (chat.pending) {
    await sendFollowup(chat, text, images);
    return;
  }
  clearComposer();
  if (!chat.messages) chat.messages = [];
  const items = normalizeImages(images);
  const imgs = items.length ? items.map((i) => i.url) : undefined;
  const imageNames = items.map((i) => i.fileName).filter(Boolean);
  chat.messages.push({ role: "user", content: text, images: imgs, imageNames: imageNames.length ? imageNames : undefined });
  if (activeId === chat.id) add("user", text, undefined, undefined, { images: imgs });
  await startTurn(chat);
}

async function startTurn(chat) {
  if (!chat || chat.pending) return;
  const chatId = chat.id;
  chat.pending = true;
  chat.partial = "";
  chat.thinking = [];
  chat.abort = new AbortController();
  ensurePoll();
  let liveBubble = null;
  if (activeId === chatId) liveBubble = add("bot", "");
  syncBusy();
  const payload = chat.messages.map((m) => {
    if (m.role === "user" && Array.isArray(m.images) && m.images.length) {
      const parts = [];
      const names = Array.isArray(m.imageNames) ? m.imageNames : [];
      const items = m.images.slice(0, 8).map((url, i) => ({ url, fileName: names[i] || "" })).filter((x) => x.url);
      const hint = attachmentHint(items);
      const text = [m.content, hint].filter(Boolean).join("\n\n");
      if (text) parts.push({ type: "text", text });
      items.forEach((item) => {
        parts.push({ type: "image_url", image_url: { url: item.url } });
      });
      if (parts.length) return { role: m.role, content: parts };
    }
    return { role: m.role, content: m.content };
  });
  await saveChat(chat);
  let answer = "";
  const tools = [];
  chat.liveTools = tools;
  const paintLive = (done) => {
    chat.partial = stripThinkingPrefix(answer, chat.thinking);
    chat.liveTools = tools;
    if (activeId !== chatId) return;
    const bubble = liveBubble || log.querySelector(".msg.bot:last-of-type .bubble");
    if (!bubble) return;
    const md = bubble.querySelector(".md") || bubble;
    setBubble(md, chat.partial, { preview: !!done });
    const row = bubble.querySelector(".tools");
    if (row) paintTools(row, tools);
    const thEl = bubble.querySelector(".think");
    if (thEl) paintThinking(thEl, chat.thinking, !done);
    const qEl = bubble.querySelector(".qsums");
    if (qEl) paintQsums(qEl, chat.questions);
    renderAsk(chat);
    stickToBottom();
  };
  try {
    let streamErr = null;
    await streamChat({
      model: "openclaw/default",
      stream: true,
      user: "moss-" + chatId,
      messages: payload
    }, chat.abort.signal, (j) => {
      if (j.error) {
        streamErr = new Error(j.error.message || j.error.code || "OpenClaw error");
        return;
      }
      try {
        const delta = j.choices && j.choices[0] && j.choices[0].delta;
        if (!delta) return;
        let changed = false;
        if (delta.moss_tool) {
          upsertTool(tools, delta.moss_tool);
          changed = true;
        }
        if (delta.moss_question) {
          chat.questions = upsertQuestion(chat.questions || [], delta.moss_question);
          chat.asking = (chat.questions || []).some((q) => q.status === "pending");
          if (chat.asking) chat.pending = true;
          changed = true;
        }
        if (delta.moss_thinking) {
          const items = delta.moss_thinking.items || delta.moss_thinking.text || delta.moss_thinking;
          chat.thinking = thinkingList(items);
          changed = true;
        }
        if (Array.isArray(delta.tool_calls)) {
          delta.tool_calls.forEach((t) => {
            const fn = t.function || {};
            upsertTool(tools, {
              id: t.id || "",
              idx: t.index,
              name: fn.name || "",
              args: typeof fn.arguments === "string" ? fn.arguments : "",
              phase: "start",
              appendArgs: !fn.name && typeof fn.arguments === "string"
            });
          });
          changed = true;
        }
        if (delta.content) {
          answer += delta.content;
          changed = true;
        }
        if (changed) paintLive();
      } catch (e) {}
    });
    if (chat.gone) return;
    if (streamErr) throw streamErr;
    const last = chat.messages[chat.messages.length - 1];
    const asked = slimClientQuestions(chat.questions);
    const think = thinkingList(chat.thinking);
    const visible = stripThinkingPrefix(answer, think);
    if (last && last.role === "assistant") {
      last.content = visible;
      if (tools.length) last.tools = tools;
      else delete last.tools;
      if (asked.length) last.questions = asked;
      else delete last.questions;
      if (think.length) last.thinking = think;
      else delete last.thinking;
    } else {
      chat.messages.push({ role: "assistant", content: visible, tools: tools.length ? tools : undefined, questions: asked.length ? asked : undefined, thinking: think.length ? think : undefined });
    }
    chat.partial = "";
    chat.liveTools = [];
    chat.pending = pendingQuestions(chat.questions).length > 0;
    chat.asking = chat.pending;
    chat.abort = null;
    await saveChat(chat);
    if (activeId === chatId) {
      paintLive(true);
      setStatus("ready");
    }
  } catch (e) {
    if (chat.gone) return;
    const raw = (e && e.message) || "request failed";
    const dropped = e.name === "AbortError" || e.code === "pending" || /failed to fetch|networkerror|load failed|connection|aborted/i.test(raw);
    if (dropped) {
      chat.abort = null;
      chat.pending = true;
      chat.partial = answer || chat.partial || "";
      chat.liveTools = tools.length ? tools : (chat.liveTools || []);
      ensurePoll();
      tickPending();
      if (activeId === chatId) syncBusy();
      return;
    }
    const errText = "(error) " + raw;
    if (activeId === chatId) {
      const bubble = liveBubble || log.querySelector(".msg.bot:last-of-type .bubble");
      const md = bubble && (bubble.querySelector(".md") || bubble);
      if (md) md.textContent = answer ? answer + "\n\n" + errText : errText;
      const row = bubble && bubble.querySelector(".tools");
      if (row && tools.length) paintTools(row, tools);
      setStatus("bad");
    }
    if (answer || tools.length || thinkingList(chat.thinking).length) {
      const think = thinkingList(chat.thinking);
      chat.messages.push({
        role: "assistant",
        content: stripThinkingPrefix(answer, think) || errText,
        tools: tools.length ? tools : undefined,
        questions: slimClientQuestions(chat.questions).length ? slimClientQuestions(chat.questions) : undefined,
        thinking: think.length ? think : undefined
      });
      chat.partial = "";
      chat.liveTools = [];
      await saveChat(chat);
    }
    chat.pending = false;
  } finally {
    chat.partial = chat.partial || "";
    if (activeId === chatId) {
      syncBusy();
      input.focus();
    }
    if (chats.some((c) => c.pending)) ensurePoll();
    else stopPollIfIdle();
  }
}

log.addEventListener("click", (e) => {
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    const block = tab.closest(".code-block");
    if (!block) return;
    block.dataset.view = tab.dataset.tab;
    block.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b === tab));
    return;
  }
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  const block = btn.closest(".code-block");
  const code = block && block.querySelector("pre code");
  if (!code) return;
  const text = code.textContent || "";
  const done = () => {
    btn.textContent = "Copied";
    setTimeout(() => { btn.textContent = "Copy"; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => {});
    return;
  }
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.setAttribute("readonly", "");
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  document.body.appendChild(ta);
  ta.select();
  try { if (document.execCommand("copy")) done(); } catch (err) {}
  ta.remove();
});
window.addEventListener("message", (e) => {
  const h = e && e.data && e.data.mossHtmlHeight;
  if (h == null) return;
  document.querySelectorAll("iframe.html-frame").forEach((frame) => {
    if (frame.contentWindow !== e.source) return;
    const px = Math.min(Math.max(Number(h) || 0, 80), Math.round(window.innerHeight * 0.7));
    frame.style.height = px + "px";
  });
});
document.getElementById("form").addEventListener("submit", (e) => {
  e.preventDefault();
});
sendBtn.addEventListener("click", () => {
  const text = input.value.trim();
  const images = stagedSnapshot();
  if (!text && !images.length) return;
  clearComposer();
  send(text || "(photo)", images);
});
attachBtn.addEventListener("click", () => {
  attachInput.click();
});
attachInput.addEventListener("change", () => {
  stageFiles(attachInput.files);
  attachInput.value = "";
});
document.getElementById("openNav").addEventListener("click", () => setNav(true));
document.getElementById("closeNav").addEventListener("click", () => setNav(false));
document.getElementById("scrim").addEventListener("click", () => setNav(false));
document.getElementById("newChat").addEventListener("click", () => createChat());
document.getElementById("markAllRead").addEventListener("click", () => markAllRead());
document.addEventListener("pointerdown", (e) => {
  const menu = document.getElementById("noteMenu");
  if (!menu || menu.hidden) return;
  if (menu.contains(e.target)) return;
  hideNoteMenu();
}, true);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") hideNoteMenu();
});
bindLongPress(document.querySelector(".chat-head"), () => {
  showNoteMenuFor(document.querySelector(".chat-head"));
}, () => view !== "chat");
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === "Return") e.stopPropagation();
});
document.addEventListener("keydown", (e) => {
  if (askEl.hidden || askUi.submitting) return;
  const tag = e.target && e.target.tagName;
  if (tag === "TEXTAREA" || tag === "INPUT") return;
  const n = Number(e.key);
  if (n >= 1 && n <= 4) {
    const btn = askEl.querySelectorAll(".ask-opt:not(.other)")[n - 1];
    if (btn) {
      e.preventDefault();
      btn.click();
    }
  }
});

async function checkGateway() {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 8000);
  try {
    const res = await fetch("/v1/models", { cache: "no-store", signal: ctrl.signal });
    if (res.ok) setStatus("ready");
    else setStatus("bad");
  } catch (e) {
    setStatus("bad");
  } finally {
    clearTimeout(t);
  }
}
checkGateway();
boot().then(() => {
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refreshVisible();
  });
  window.addEventListener("pageshow", (e) => {
    if (e.persisted) refreshVisible();
  });
});
input.focus();
</script>
